<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype 2C — Waveform / Pulse Feedback</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main class="prototype-shell">
  <!--
    Place the title and a brief instruction before the interactive area, so that players know how to proceed from the outset.
    Keep the instructions brief, leaving room for actual interaction and visual feedback.
  -->
  <header class="page-header">
    <h1>Prototype 2C — Waveform / Pulse Feedback</h1>
    <p>Follow the target point. The waveform becomes calmer as stability increases.</p>
  </header>

  <!--
    Rhythm inputs and spatial inputs are arranged on the left and right respectively, with the combined result displayed in the centre, to help players understand their respective roles.
    The six prototypes follow this structure, minimising other layout differences when comparing input methods or feedback graphics.
  -->
  <section class="interaction-grid" aria-label="Two-player audio interface">
    <section class="player-panel player-a" aria-labelledby="player-a-title">
      <div class="section-heading">
        <p>Player A</p>
        <h2 id="player-a-title">Rhythm Input</h2>
      </div>

      <!--
        Native buttons are used here to clearly indicate the action to be performed.
        The `data-key` attribute links each button to its corresponding sound, whilst the event and sound-play logic are centralised in `script.js`.
      -->
      <div class="key-grid" aria-label="Sound controls">
        <button class="sound-key" type="button" data-key="a" aria-label="Play sound A">
          <span>A</span>
        </button>
        <button class="sound-key" type="button" data-key="s" aria-label="Play sound S">
          <span>S</span>
        </button>
        <button class="sound-key" type="button" data-key="d" aria-label="Play sound D">
          <span>D</span>
        </button>
        <button class="sound-key" type="button" data-key="f" aria-label="Play sound F">
          <span>F</span>
        </button>
      </div>

      <p class="panel-instruction">Press Keys Or Click</p>
    </section>

    <!--
      The waveform and the outer ring are drawn separately; the outer ring is fixed, whilst the inner path is used to represent stability.
      This path is a schematic representation of the audio state, not an actual audio waveform.
      The status text next to the graphic provides additional context to ensure meaning is not conveyed solely through colour.
    -->
    <section class="sync-panel" aria-labelledby="sync-title">
      <p>Shared State</p>
      <div class="sync-display" data-feedback="wave" aria-hidden="true">
        <svg class="feedback-svg" viewBox="0 0 120 120">
          <circle class="wave-frame" cx="60" cy="60" r="56" />
          <path class="waveform" d="M 16 60 L 104 60" />
        </svg>
      </div>
      <h2 id="sync-title">Sync Point</h2>
      <p class="sync-status" aria-live="polite">Noisy</p>
    </section>

    <section class="player-panel player-b" aria-labelledby="player-b-title">
      <div class="section-heading">
        <p>Player B</p>
        <h2 id="player-b-title">Spatial Input</h2>
      </div>

      <!--
        Select ‘Hover Mode’ here to allow continuous mouse movement to be interpreted directly as input.
        The area can be highlighted to make it easier to identify the current position; actual coordinate input is still handled by mouse events in the script.
      -->
      <div
              class="spatial-field"
              data-input-mode="hover"
              role="application"
              tabindex="0"
              aria-label="Follow the moving filled dot. Closer sounds calmer; farther sounds noisier."
      >
        <!--
          The directional text explains the relationship between the left-right sound image and the up-down timbre, helping players to associate their movement direction with changes in sound.
          The dark dots represent movement targets, whilst the red dots indicate the player’s inputs; the distance between the two is used to calculate stability.
        -->
        <span class="axis-label axis-left">L</span>
        <span class="axis-label axis-right">R</span>
        <span class="axis-label axis-top">Bright</span>
        <span class="axis-label axis-bottom">Muted</span>
        <div class="target" aria-hidden="true"></div>
        <div class="cursor-dot" aria-hidden="true"></div>
      </div>
      <p class="spatial-status" aria-live="polite">Move to control</p>
    </section>
  </section>

  <!--
    When the audio fails to start, display a prompt below the interaction area to prevent players from mistaking the absence of sound for their actions not taking effect.
  -->
  <p class="audio-message" role="status" aria-live="polite"></p>
</main>

<!--
  Load the script only after the buttons and feedback elements on the page have been created, so that events can be bound to existing interface elements.
-->
<script src="script.js"></script>
</body>
</html>
